{{ $lightTheme := "light" }}
{{ $darkTheme := "catppuccin_macchiato" }}

{{ if ne (hugo.Environment) "development" }}
<div id="comments">
<script>
  const initialTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? '{{ $darkTheme }}' : '{{ $lightTheme }}';
</script>
<script src="https://giscus.app/client.js"
    data-repo="justinmklam/personal-blog"
    data-repo-id="MDEwOlJlcG9zaXRvcnkzODQ2MjI4NjE="
    data-category="Blog Comments"
    data-category-id="DIC_kwDOFuzhDc4Cuowr"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="1"
    data-input-position="top"
    data-theme="{{ $lightTheme }}"
    data-lang="en"
    crossorigin="anonymous"
    async>
</script>
<script>
  document.currentScript.previousElementSibling.setAttribute('data-theme', initialTheme);
</script>
</div>
{{ else }}
<pre>Comments disabled in development mode.</pre>
{{ end }}
