{{ $lightTheme := "light" }}
{{ $darkTheme := "catppuccin_macchiato" }}

{{ $enableGiscus := or (ne (hugo.Environment) "development") (os.Getenv "HUGO_GISCUS") }}
{{ if $enableGiscus }}
<div id="comments">
<script>
  const initialTheme = document.documentElement.classList.contains('dark') ? '{{ $darkTheme }}' : '{{ $lightTheme }}';
  window.setGiscusTheme = function(isDark) {
    var iframe = document.querySelector('iframe.giscus-frame');
    if (iframe) {
      iframe.contentWindow.postMessage({
        giscus: { setConfig: { theme: isDark ? '{{ $darkTheme }}' : '{{ $lightTheme }}' } }
      }, 'https://giscus.app');
    }
  };
</script>
<script src="https://giscus.app/client.js"
    data-repo="justinmklam/personal-blog"
    data-repo-id="MDEwOlJlcG9zaXRvcnkzODQ2MjI4NjE="
    data-category="Blog Comments"
    data-category-id="DIC_kwDOFuzhDc4Cuowr"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="1"
    data-input-position="top"
    data-theme="{{ $lightTheme }}"
    data-lang="en"
    crossorigin="anonymous"
    async>
</script>
<script>
  document.currentScript.previousElementSibling.setAttribute('data-theme', initialTheme);
</script>
</div>
{{ else }}
<pre>Comments disabled in development mode.</pre>
{{ end }}
