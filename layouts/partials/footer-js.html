<!--Mathjax support, if the page needs it-->
{{ if .Param "math" }}
    <script async type="text/javascript" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{{ end }}

{{ if .Param "icons" }}
<!-- https://github.com/feathericons/feather -->
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script>
  feather.replace();
</script>
{{ end }}

<!-- Giscus comment count manager -->
{{ $giscusJs := resources.Get "js/giscus-comments.js" }}
{{ if $giscusJs }}
    {{ $giscusJs := $giscusJs | resources.Minify }}
    <script src="{{ $giscusJs.RelPermalink }}" defer></script>
{{ end }}

<!-- Theme toggle -->
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var r=document.documentElement;var isDark=r.classList.contains('dark');var isLight=r.classList.contains('light');var c=document.getElementById('syntax-dark-css');if(isDark){r.classList.remove('dark');r.classList.add('light');localStorage.setItem('theme','light');if(c)c.media='not screen';if(window.setGiscusTheme)window.setGiscusTheme(false);b.title='Light mode'}else if(isLight){r.classList.remove('light');localStorage.setItem('theme','system');var prefersDark=window.matchMedia('(prefers-color-scheme:dark)').matches;if(c)c.media=prefersDark?'screen':'not screen';if(window.setGiscusTheme)window.setGiscusTheme(prefersDark);b.title='System theme'}else{r.classList.add('dark');localStorage.setItem('theme','dark');if(c)c.media='screen';if(window.setGiscusTheme)window.setGiscusTheme(true);b.title='Dark mode'}})})();
</script>
