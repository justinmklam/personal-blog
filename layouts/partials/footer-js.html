<!--Mathjax support, if the page needs it-->
{{ if .Param "math" }}
    <script async type="text/javascript" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{{ end }}

{{ if .Param "icons" }}
<!-- https://github.com/feathericons/feather -->
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script>
  feather.replace();
</script>
{{ end }}

<!-- Giscus comment count manager -->
{{ $giscusJs := resources.Get "js/giscus-comments.js" }}
{{ if $giscusJs }}
    {{ $giscusJs := $giscusJs | resources.Minify }}
    <script src="{{ $giscusJs.RelPermalink }}" defer></script>
{{ end }}

<!-- Theme toggle -->
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;b.addEventListener('click',function(){var r=document.documentElement;var wasDark=r.classList.contains('dark');var d;if(wasDark){r.classList.remove('dark');r.classList.add('light');d=false}else{var wasLight=r.classList.contains('light');if(wasLight){r.classList.remove('light');r.classList.add('dark');d=true}else{var prefersDark=window.matchMedia('(prefers-color-scheme:dark)').matches;if(prefersDark){r.classList.add('light');d=false}else{r.classList.add('dark');d=true}}}localStorage.setItem('theme',d?'dark':'light');var c=document.getElementById('syntax-dark-css');if(c)c.media=d?'screen':'not screen';if(window.setGiscusTheme)window.setGiscusTheme(d)})})();
</script>
